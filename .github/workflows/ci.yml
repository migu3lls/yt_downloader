name: CI — Security, SDK & Build Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript-sdk-and-web:
    name: TypeScript SDK, CLI & Next.js 15 Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Biome Linter & Formatter Check
        run: npm run lint

      - name: Run Vitest Unit & Security Test Suite
        run: npm test

      - name: Verify CLI Binary Execution
        run: |
          node ./bin/yt-dl.mjs --version
          node ./bin/yt-dl.mjs --help

      - name: Build Next.js 15 Production Bundle
        run: npm run build

  python-sdk-and-cli:
    name: Python SDK & CLI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python Security Validator Unit Tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify Python CLI Execution
        run: |
          PYTHONPATH=python python -m yt_downloader.cli "https://www.youtube.com/watch?v=dQw4w9WgXcQ" --info --json
